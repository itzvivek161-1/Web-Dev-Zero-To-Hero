<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Practice</title>
</head>
<body style="background-color: pink;">

    <!-- Unique ID -->
    <h1 id="first" class="heading main-heading">
        Strike is Coming
    </h1>

    <!-- Tag + Class -->
    <h2 class="heading sub-heading">
        It is coming on Dhanteras.
    </h2>

    <!-- Multiple Paragraphs -->
    <p class="text">This is paragraph 1</p>
    <p class="text special">This is paragraph 2</p>
    <p>This is paragraph 3</p>

    <!-- List for traversal -->
    <ul id="list">
        <li class="item">Item 1</li>
        <li class="item special">Item 2</li>
        <li class="item">Item 3</li>
    </ul>

    <!-- Button -->
    <button id="btn">Click Me</button>

    <script src="script.js"></script>
</body>
</html>
